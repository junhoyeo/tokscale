[package]
name = "tokscale-cli"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "CLI and TUI for tokscale - AI token usage analytics"
# `src/bin/fake_codex.rs` is a second binary (a test stand-in for the `codex`
# CLI, see its module docs), so `cargo run -p tokscale-cli` would otherwise be
# ambiguous — which `build-native.yml` relies on for the Android smoke step.
default-run = "tokscale"

[[bin]]
name = "tokscale"
path = "src/main.rs"

[features]
# Optional: native FFI into Apple's FoundationModels (on-device Apple Intelligence)
# for the `apple-fm` report summarizer backend. macOS-only; no-op elsewhere.
# NOT enabled by default — the default build degrades to a Rust heuristic.
apple-fm = []

[dependencies]
tokscale-core = { workspace = true }

clap = { workspace = true }
ratatui = { workspace = true }
crossterm = { workspace = true }
tokio = { workspace = true }
anyhow = { workspace = true }
comfy-table = { workspace = true }
colored = { workspace = true }
indicatif = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
chrono = { workspace = true }
dirs = { workspace = true }
rayon = { workspace = true }
reqwest = { workspace = true }
fs2 = { workspace = true }
# Only the codecs `wrapped` actually touches: it saves PNG and decodes the
# PNG/JPEG/WebP logo and avatar assets it downloads. `image`'s default
# feature set additionally links AVIF, BMP, DDS, EXR, Farbfeld, GIF, HDR,
# ICO, PNM, QOI, TGA and TIFF decoders that nothing in the tree can reach.
# `imageproc` already depends on `image` with `default-features = false`,
# so this crate is the only thing that was turning them on.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
# `imageproc`'s default feature is `["rayon", "image/default"]`, so leaving it on
# re-enables every codec the line above just switched off. `rayon` is the only
# part of that default this crate wants.
imageproc = { version = "0.25", default-features = false, features = ["rayon"] }
ab_glyph = "0.2"
# The only SVG the CLI ever renders is `TOKSCALE_LOGO_SVG_URL`, which is three
# `<path>` elements - no `<text>`, no `<image>`, no `font-family`. resvg's
# default features assume otherwise and cost a second copy of half the image
# stack: `raster-images` links its own `gif`, `image-webp` and `zune-jpeg` at
# versions that do not unify with the ones `image` already provides, and `text`
# pulls `fontdb`, `rustybuzz`, `unicode-bidi`, `unicode-script` and
# `unicode-vo`. Wrapped's own text is drawn with `ab_glyph`, not usvg.
resvg = { version = "0.43", default-features = false }
usvg = { version = "0.43", default-features = false }
hostname = "0.4"
# `login --qr` renders through `qrcode::render::unicode`, which is in the core.
# The default feature set adds the `image`, `svg` and `pic` renderers instead.
qrcode = { version = "0.14", default-features = false }
uuid = { version = "1.0", features = ["v4"] }
rpassword = "7.0"
sha2 = "0.10"
csv = "1.3"
unicode-normalization = "0.1"
unicode-width = { workspace = true }
unicode-segmentation = { workspace = true }

# Trae iCubeAuthInfo decryption (Electron globalStorage)
aes = { workspace = true }
cbc = { workspace = true }
base64 = { workspace = true }

# Cursor desktop state.vscdb accessToken import
rusqlite = { workspace = true }

# Two unrelated Android exclusions share this table because TOML allows a
# target only one `dependencies` table.
#
# reqwest: only the Cursor client needs native TLS (#1250) and it is opted
# into per target, never on the workspace entry, because reqwest's
# `native-tls` feature implies `default-tls` and `default-tls` alone decides
# `TlsBackend::default()`. Under resolver = "2" a `[target.'cfg(...)']` block
# is resolved per compilation target, so this does not leak into Android.
# Android is excluded on purpose: openssl-src builds Android with `no-stdio`,
# which stubs `BIO_new_file` and `BIO_s_file` and therefore the whole CA-file
# loader, so a native-tls Android build would run against an empty trust
# store and reject every certificate. Android keeps pure rustls and loses
# Cursor login; `cursor.rs` gates `.use_native_tls()` on the identical cfg.
#
# arboard has no Android backend and fails to compile for
# aarch64-linux-android. The clipboard module in tui/ provides a
# no-op fallback on Android so the rest of the code stays portable.
[target.'cfg(not(target_os = "android"))'.dependencies]
reqwest = { workspace = true, features = ["native-tls"] }
# The TUI yank key only ever calls `Clipboard::set_text`. `arboard`'s default
# `image-data` feature pulls in `image` (with `tiff` on macOS) plus the
# CoreGraphics / Win32 GDI bitmap paths for clipboard images nothing reads.
arboard = { version = "3", default-features = false }

# Vendor OpenSSL on every Linux target, gnu as well as musl. The Linux cross
# builds run under cargo-zigbuild (.github/workflows/build-native.yml) and
# that environment has no usable system OpenSSL: the x86_64 job cannot
# preprocess Debian's multiarch /usr/include/openssl/macros.h through zigcc,
# and the aarch64 job has no aarch64 OpenSSL on the runner at all. Vendoring
# also keeps the published linux-gnu artifact from acquiring a hard runtime
# dependency on the build host's libssl.so.3 soname. macOS and Windows are
# absent from this list because native-tls uses Security.framework and
# schannel there and never touches OpenSSL.
[target.'cfg(target_os = "linux")'.dependencies]
reqwest = { workspace = true, features = ["native-tls-vendored"] }

[target.'cfg(windows)'.dependencies]
# windows-sys 0.61 is already in the lockfile via tokio and mio, and via
# clap's anstyle-wincon/anstyle-query, so this adds no new dependency
# versions. (colored and rpassword pull 0.59, not 0.61.) Unlike the windows
# crate it needs no `Win32_Foundation` feature — the foundation types live in
# `windows_sys::core`.
windows-sys = { version = "0.61", features = ["Win32_Security_Credentials"] }

[target.'cfg(unix)'.dependencies]
signal-hook = { workspace = true }

[dev-dependencies]
assert_cmd = "2.0"
predicates = "3.0"
tempfile = "3.0"
serial_test = "3.0"
# DSH transcript fixtures are zstd frames; the CLI tests write them directly.
zstd = { workspace = true }
