name: Coverage

on:
  workflow_dispatch:
  # Tarpaulin runs the whole suite a second time under instrumentation, which
  # takes about half an hour, to refresh a badge whose rounded value moves
  # once every week or two. The Tests workflow already runs the suite on
  # every push, so this runs weekly instead of on each one.
  schedule:
    - cron: "17 3 * * 1"

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

concurrency:
  group: coverage
  cancel-in-progress: false

jobs:
  coverage:
    name: Coverage Report
    # The badge is committed to main, so a manual run from another branch
    # must not produce one.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.98.0

      - name: Install cargo-tarpaulin
        uses: taiki-e/install-action@cargo-tarpaulin

      - name: Generate coverage report
        run: |
          cargo tarpaulin \
            --workspace \
            --all-features \
            --out Xml Json \
            --output-dir ./coverage \
            --timeout 300 \
            --fail-under 45 \
            --verbose

      - name: Extract coverage percentage
        id: coverage
        run: |
          COVERAGE=$(jq -r '
            [.files[]] |
            (map(.covered) | add) as $total_covered |
            (map(.coverable) | add) as $total_coverable |
            if $total_coverable > 0 then
              ($total_covered / $total_coverable * 100)
            else
              0
            end
          ' ./coverage/tarpaulin-report.json)
          COVERAGE_INT=$(printf "%.0f" "$COVERAGE")
          echo "percentage=$COVERAGE" >> "$GITHUB_OUTPUT"
          echo "percentage_int=$COVERAGE_INT" >> "$GITHUB_OUTPUT"
          echo "Coverage: $COVERAGE%"
          
          # Determine badge color
          if [ "$COVERAGE_INT" -gt 80 ]; then
            echo "color=green" >> "$GITHUB_OUTPUT"
          elif [ "$COVERAGE_INT" -gt 60 ]; then
            echo "color=yellow" >> "$GITHUB_OUTPUT"
          elif [ "$COVERAGE_INT" -gt 40 ]; then
            echo "color=orange" >> "$GITHUB_OUTPUT"
          else
            echo "color=red" >> "$GITHUB_OUTPUT"
          fi

      - name: Create badges directory
        run: mkdir -p .github/badges

      - name: Generate coverage badge
        uses: emibcn/badge-action@v2.0.4
        with:
          label: 'coverage'
          status: ${{ steps.coverage.outputs.percentage_int }}%
          color: ${{ steps.coverage.outputs.color }}
          path: .github/badges/coverage.svg

      - name: Commit coverage badge
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add .github/badges/coverage.svg
          git diff --staged --quiet && exit 0
          git commit -m "ci: update coverage badge [skip ci]"
          for _ in 1 2 3; do
            git push && exit 0
            git pull --rebase -X theirs origin main || exit 1
          done
          git push

      - name: Upload coverage artifacts
        uses: actions/upload-artifact@v6
        if: "!cancelled()"
        with:
          name: coverage-report
          path: ./coverage/
          retention-days: 7
