name: Tests

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: &test_coverage_paths
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - '.github/workflows/test_coverage.yml'
  pull_request:
    branches: [main]
    paths: *test_coverage_paths

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

concurrency:
  group: test-coverage-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  tui-startup-macos:
    name: TUI startup (macOS)
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.98.0
      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Cache cargo registry
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: tui-startup-${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            tui-startup-${{ runner.os }}-cargo-
      - name: Exercise real TUI startup and blocked Keychain navigation
        run: cargo test --locked -p tokscale-cli --test tui_startup -- --nocapture

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.98.0
        with:
          components: clippy, rustfmt
      - name: Cache cargo registry
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: lint-${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            lint-${{ runner.os }}-cargo-
      - name: Check formatting (strict)
        run: cargo fmt --all -- --check
      - name: Run Clippy (strict)
        run: cargo clippy --locked --workspace --all-features -- -D warnings

  rustdoc:
    name: Rustdoc
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.98.0
      - name: Cache cargo registry
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: rustdoc-${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            rustdoc-${{ runner.os }}-cargo-
      - name: Build docs (deny warnings)
        # Doc comments are not compiled by clippy: broken intra-doc links,
        # bare URLs, and `<...>` placeholders parsed as HTML tags only fail
        # here.
        run: RUSTDOCFLAGS='-D warnings' cargo doc --locked --no-deps --workspace

  # Windows is a first-class target - `build-native.yml` ships
  # x86_64/aarch64-pc-windows-msvc artifacts - but until #997 nothing ever
  # *executed* a test there, so Windows-only defects reached users unseen.
  #
  # The leg was advisory (`continue-on-error`) while the 33 pre-existing
  # failures that first run exposed were worked through, across six unrelated
  # root causes (#1014). Those landed in #1007, #1012 and #1046, and the suite
  # now completes green across all 10 test binaries.
  #
  # Most of the 33 were the harness lying, not the product: fixtures built
  # JSON with `format!` and dropped a raw path inside a string, so on Windows
  # `C:\Users\RUNNER~1\...` put `\U` and `\A` in the document and serde_json
  # rejected it. Both readers treat unparseable config as absent, so the Crush
  # registry scan returned nothing and cc-mirror sessions fell back to plain
  # Claude - failures that read like product defects several files from the
  # cause. The real writers (Go `encoding/json`, Node `JSON.stringify`) escape
  # correctly, so only the tests ever emitted invalid JSON.
  #
  # Genuine product defects surfaced by the Windows leg did turn up
  # underneath. From #1007: a contended lock classified as an error instead
  # of "already running", so a scheduled autosubmit recorded a failure;
  # `pid_is_alive` hardcoded false off Unix, so every sync lock looked stale
  # and overlapping syncs could delete each other's artifacts; and manifest
  # artifact paths rendered with the native separator, which the
  # cache-relative validator rejected - so any Windows sync with an artifact
  # to retire failed after the manifest was already written. From #1046: TZ
  # leaving a device permanently unpinnable, the bare `default` token
  # fuzzy-matching a priced key, and one file cached under two keys because
  # the scan root joins with `/` while `WalkDir` appends `\`.
  #
  # The `default` one is the same class of bug as #1062 - a generic token
  # with no model identity electing some provider's priced row - and it was
  # never Windows-only: it mispriced on every platform. Its test is ungated
  # and ran on the Ubuntu leg every PR, where the fixture's empty catalog
  # starved the fuzzy matcher. What exposed it was the sandbox escape above,
  # the child reading the runner's real `%APPDATA%` catalog and hitting real
  # prices - a harness defect making a product defect visible.
  #
  # It is a HARD GATE as of this change. The advisory phase was explicitly
  # temporary - an advisory job nobody reads is how #997 happened in the first
  # place - so a Windows regression must now fail the build like any other.
  # Do not reintroduce `continue-on-error` here to land a red PR; fix the
  # failure or revert the change that caused it.
  tests:
    name: Tests
    runs-on: ${{ matrix.os }}
    strategy:
      # Both platforms must report. Cancelling the Windows leg the moment
      # Ubuntu fails (or vice versa) would hide whether a failure is
      # cross-platform or platform-specific - the single most useful bit of
      # information when triaging.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.98.0

      - name: Cache cargo registry
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: tests-${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            tests-${{ runner.os }}-cargo-

      # `--no-fail-fast` because cargo otherwise stops at the first test
      # binary that fails and never runs the rest. That is precisely how #997
      # went unnoticed for so long: twelve failures in `tokscale-cli` meant
      # the other nine binaries produced no result at all, so a contributor
      # could not tell their own breakage from the pre-existing set.
      - name: Run tests
        run: cargo test --workspace --all-features --no-fail-fast
