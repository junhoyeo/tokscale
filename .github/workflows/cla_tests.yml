name: CLA tests

on:
  push:
    branches: [main]
    paths: &cla_paths
      - ".github/scripts/cla/**"
      - ".github/workflows/cla.yml"
      - ".github/workflows/cla_tests.yml"
      - "docs/cla-setup.md"
  pull_request:
    paths: *cla_paths

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false
      - run: node --test .github/scripts/cla/*.test.mjs
