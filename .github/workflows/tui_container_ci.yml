name: TUI Container CI

on:
  workflow_dispatch:
  # Every merge that changes the Rust workspace still builds the image once.
  push:
    branches: [main]
    paths:
      - ".dockerignore"
      - "Dockerfile.tui"
      - "Makefile"
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/**"
      - "docker-compose.yml"
      - "scripts/test-tui-mounts.sh"
      - ".github/workflows/tui_container_ci.yml"
  # A pull request builds the image only when it changes what the image is
  # made from: the container files, the dependency set, or a build script.
  # Rust source changes are compiled for musl by the native build workflow on
  # the pull request and by the push run above after the merge.
  pull_request:
    branches: [main]
    paths:
      - ".dockerignore"
      - "Dockerfile.tui"
      - "Makefile"
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/*/Cargo.toml"
      - "crates/*/build.rs"
      - "docker-compose.yml"
      - "scripts/test-tui-mounts.sh"
      - ".github/workflows/tui_container_ci.yml"

permissions:
  contents: read

concurrency:
  group: tui-container-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  tui-container:
    name: TUI Container
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Verify TUI default mount safety
        run: bash scripts/test-tui-mounts.sh

      - name: Build TUI image
        run: make DOCKER=docker tui/build

      - name: Smoke-test TUI image entrypoint
        run: docker run --rm tokscale-tui:latest --no-spinner --help
