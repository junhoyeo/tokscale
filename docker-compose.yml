services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      # Override all four variables together when changing credentials —
      # compose cannot derive DATABASE_URL from POSTGRES_* via variable nesting.
      POSTGRES_USER: ${POSTGRES_USER:-tokscale}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tokscale}
      POSTGRES_DB: ${POSTGRES_DB:-tokscale}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      # Bound to loopback only — not exposed on all interfaces.
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tokscale -d tokscale"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    # Use the image built by `make docker/build` (tagged tokscale:latest).
    # Declaring `image` here prevents compose from triggering an implicit build
    # on `make up`, which would fail because `db` is only resolvable inside the
    # compose network — not from the Docker build context.
    image: tokscale:latest
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # next build statically prerenders pages that query the DB, so
        # DATABASE_URL must resolve to a live database at build time.
        # Build the image separately with `make docker/build` after starting
        # the db service; do not rely on compose's implicit --build here.
        DATABASE_URL: ${DATABASE_URL:-postgresql://tokscale:tokscale@db:5432/tokscale}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://tokscale:tokscale@db:5432/tokscale}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      NEXT_PUBLIC_URL: ${NEXT_PUBLIC_URL:-http://localhost:3000}
      AUTH_SECRET: ${AUTH_SECRET:-}
      # CSRF_ALLOWED_ORIGINS: ${CSRF_ALLOWED_ORIGINS}
    ports:
      - "127.0.0.1:3333:3000"

  tui:
    build:
      context: .
      dockerfile: Dockerfile.tui
    profiles: [tui]
    stdin_open: true
    tty: true
    volumes:
      # tokscale config and cache (read-write so settings persist across runs)
      - ${HOME}/.config/tokscale:/root/.config/tokscale
      - ${HOME}/.cache/tokscale:/root/.cache/tokscale
      # Client data directories — add or remove mounts for the clients you use.
      # All paths are read-only; the TUI only reads session data.
      - ${HOME}/.claude:/root/.claude:ro
      # VS Code extensions (Cline / Roo / Claude Dev) — Linux path
      - ${HOME}/.config/Code/User/globalStorage:/root/.config/Code/User/globalStorage:ro
      # Cursor
      - ${HOME}/.config/Cursor/User/globalStorage:/root/.config/Cursor/User/globalStorage:ro
      # Zed
      - ${HOME}/.local/share/zed:/root/.local/share/zed:ro

volumes:
  postgres_data:
